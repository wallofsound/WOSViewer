name: WOSViewer
options:
  bundleIdPrefix: se.wallofsound
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: se.wallofsound.WOSViewer
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: WOS Viewer
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    INFOPLIST_KEY_NSHumanReadableCopyright: "© WallofSound AB"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Not used — audio is loaded from files only."
targets:
  WOSViewer:
    type: application
    platform: macOS
    sources:
      - path: WOSViewer
        excludes:
          - "AppIcon.icns"
    settings:
      base:
        PRODUCT_NAME: WOS Viewer
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: WOSViewer/WOSViewer.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WOSViewer/Info.plist
      properties:
        CFBundleDisplayName: WOS Viewer
        CFBundleName: WOS Viewer
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.microsoft.waveform-audio
          - CFBundleTypeName: CSV
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
              - public.delimited-values-text
schemes:
  WOSViewer:
    build:
      targets:
        WOSViewer: all
    run:
      config: Debug
